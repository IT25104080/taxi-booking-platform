<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>VibeRide</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="container"><h1>Driver Management</h1><a class="btn" href="/drivers/new">Add Driver</a><a class="btn secondary" href="/">Home</a><table><tr><th>ID</th><th>Name</th><th>License</th><th>Status</th><th>Vehicle</th><th>Actions</th></tr><tr th:each="d:${driverList}"><td th:text="${d.driverId}"></td><td th:text="${d.name}"></td><td th:text="${d.licenseNo}"></td><td th:text="${d.status}"></td><td th:text="${d.vehicleType + ' - ' + d.vehiclePlate}"></td><td><a th:href="@{/drivers/edit/{id}(id=${d.driverId})}">Edit</a> | <a th:href="@{/drivers/delete/{id}(id=${d.driverId})}">Delete</a></td></tr></table></div></body></html>
