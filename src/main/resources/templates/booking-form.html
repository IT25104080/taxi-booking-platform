<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>VibeRide</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="container"><h1>Add Booking</h1><a class="btn secondary" href="/bookings">Back</a><div class="grid"><div class="card"><h2>Instant Booking</h2><form action="/bookings/instant" method="post"><input name="bookingId" placeholder="Booking ID" required><input name="passengerId" placeholder="Passenger ID" required><input name="pickupLocation" placeholder="Pickup Location" required><input name="dropoffLocation" placeholder="Dropoff Location" required><input name="distanceKm" type="number" step="0.01" placeholder="Distance KM" required><input name="status" value="Pending" required><input name="surgeMultiplier" type="number" step="0.01" value="1.0" required><button class="btn">Save</button></form></div><div class="card"><h2>Scheduled Booking</h2><form action="/bookings/scheduled" method="post"><input name="bookingId" placeholder="Booking ID" required><input name="passengerId" placeholder="Passenger ID" required><input name="pickupLocation" placeholder="Pickup Location" required><input name="dropoffLocation" placeholder="Dropoff Location" required><input name="distanceKm" type="number" step="0.01" placeholder="Distance KM" required><input name="status" value="Scheduled" required><input name="scheduledTime" placeholder="Scheduled Time" required><button class="btn">Save</button></form></div></div></div></body></html>
