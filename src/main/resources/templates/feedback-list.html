<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>VibeRide</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="container"><h1>Feedback Management</h1><a class="btn" href="/feedbacks/new">Add Feedback</a><a class="btn secondary" href="/">Home</a><table><tr><th>ID</th><th>Customer</th><th>Rating</th><th>Comments</th><th>Summary</th><th>Actions</th></tr><tr th:each="f:${feedbackList}"><td th:text="${f.feedbackId}"></td><td th:text="${f.customerName}"></td><td th:text="${f.rating}"></td><td th:text="${f.comments}"></td><td th:text="${f.summary}"></td><td><a th:href="@{/feedbacks/edit/{id}(id=${f.feedbackId})}">Edit</a> | <a th:href="@{/feedbacks/delete/{id}(id=${f.feedbackId})}">Delete</a></td></tr></table></div></body></html>
