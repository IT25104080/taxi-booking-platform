<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>VibeRide</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="container"><h1>Edit Payment</h1><a class="btn secondary" href="/payments">Back</a><form th:if="${type=='CASH'}" action="/payments/update/cash" method="post"><input name="paymentId" th:value="${payment.paymentId}" readonly><input name="bookingId" th:value="${payment.bookingId}"><input name="amount" type="number" step="0.01" th:value="${payment.amount}"><input name="status" th:value="${payment.status}"><input name="date" type="date" th:value="${payment.paymentDate}"><input name="receivedAmount" type="number" step="0.01" th:value="${cashPayment.receivedAmount}"><button class="btn">Update</button></form><form th:if="${type=='CARD'}" action="/payments/update/card" method="post"><input name="paymentId" th:value="${payment.paymentId}" readonly><input name="bookingId" th:value="${payment.bookingId}"><input name="amount" type="number" step="0.01" th:value="${payment.amount}"><input name="status" th:value="${payment.status}"><input name="date" type="date" th:value="${payment.paymentDate}"><input name="cardLastFour" th:value="${cardPayment.cardLastFour}"><input name="transactionRef" th:value="${cardPayment.transactionRef}"><button class="btn">Update</button></form></div></body></html>
