<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>VibeRide</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="container"><h1>Booking Management</h1><a class="btn" href="/bookings/new">Add Booking</a><a class="btn secondary" href="/">Home</a><table><tr><th>ID</th><th>Passenger</th><th>Route</th><th>Status</th><th>Details</th><th>Actions</th></tr><tr th:each="b:${bookingList}"><td th:text="${b.bookingId}"></td><td th:text="${b.passengerId}"></td><td th:text="${b.pickupLocation + ' -> ' + b.dropoffLocation}"></td><td th:text="${b.status}"></td><td th:text="${b.bookingDetails}"></td><td><a th:href="@{/bookings/edit/{id}(id=${b.bookingId})}">Edit</a> | <a th:href="@{/bookings/delete/{id}(id=${b.bookingId})}">Delete</a></td></tr></table></div></body></html>
