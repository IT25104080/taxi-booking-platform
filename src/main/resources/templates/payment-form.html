<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>VibeRide</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="container"><h1>Add Payment</h1><a class="btn secondary" href="/payments">Back</a><div class="grid"><div class="card"><h2>Cash</h2><form action="/payments/cash" method="post"><input name="paymentId" placeholder="Payment ID" required><input name="bookingId" placeholder="Booking ID" required><input name="amount" type="number" step="0.01" placeholder="Amount" required><input name="status" value="Pending" required><input name="receivedAmount" type="number" step="0.01" placeholder="Received Amount" required><button class="btn">Save</button></form></div><div class="card"><h2>Card</h2><form action="/payments/card" method="post"><input name="paymentId" placeholder="Payment ID" required><input name="bookingId" placeholder="Booking ID" required><input name="amount" type="number" step="0.01" placeholder="Amount" required><input name="status" value="Paid" required><input name="cardLastFour" placeholder="Card Last Four" required><input name="transactionRef" placeholder="Transaction Reference" required><button class="btn">Save</button></form></div></div></div></body></html>
