<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: html(~{::title}, ~{::main})}">
<head><title th:fragment="title">Book a Ride – TaxiGo</title></head>
<main th:fragment="main">
    <section class="hero-gradient text-white py-12">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-3xl font-bold">Book Your Ride</h1>
            <p class="text-purple-100 mt-2">Logged in as <span th:text="${user.name}"></span></p>
        </div>
    </section>
    <section class="py-12 container mx-auto px-4 max-w-xl">
        <div class="bg-white rounded-xl shadow-lg p-8">
            <form th:action="@{/book-ride}" method="post" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Pickup Location</label>
                    <input type="text" name="pickup" placeholder="e.g. Colombo Fort Railway Station" required
                           class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-purple-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Drop-off Location</label>
                    <input type="text" name="dropoff" placeholder="e.g. Mount Lavinia Beach" required
                           class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-purple-500 outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Date</label>
                        <input type="date" name="pickupDate" required
                               class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-purple-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Time</label>
                        <input type="time" name="pickupTime" required
                               class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-purple-500 outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Vehicle Type</label>
                    <select name="vehicleType" class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-purple-500 outline-none">
                        <option value="standard">Standard – Sedan</option>
                        <option value="premium">Premium – Luxury (1.5×)</option>
                        <option value="xl">XL – Van / Group (2×)</option>
                    </select>
                </div>
                <div th:if="${user.userType == 'premium'}" class="bg-green-50 text-green-800 p-3 rounded text-sm">
                    ⭐ Premium member: 10% discount applied automatically
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Notes (optional)</label>
                    <textarea name="notes" rows="2" placeholder="Flight number, landmarks, etc."
                              class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-purple-500 outline-none"></textarea>
                </div>
                <button type="submit" class="w-full bg-yellow-400 text-gray-900 font-bold py-3 rounded-lg hover:bg-yellow-300">
                    Confirm Booking
                </button>
            </form>
            <p class="text-center text-sm text-gray-500 mt-4">
                Fare is estimated at checkout. <a th:href="@{/pricing}" class="text-purple-600">View pricing</a>
            </p>
        </div>
    </section>
</main>
</html>
