<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard - TaxiGo</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body>
<div class="bg-white shadow p-4">
    <div class="container mx-auto flex justify-between">
        <h1 class="text-2xl font-bold text-purple-600">🚕 TaxiGo</h1>
        <div>
            <span th:text="${user.name}"></span>
            <a href="/taxi/user/profile" class="ml-4 text-gray-600">Profile</a>
            <a href="/taxi/user/logout" class="ml-4 text-red-600">Logout</a>
        </div>
    </div>
</div>
<div class="container mx-auto mt-10">
    <div class="bg-white p-6 rounded shadow">
        <h2 class="text-xl font-bold">Welcome, <span th:text="${user.name}"></span>!</h2>
        <p>Email: <span th:text="${user.email}"></span></p>
        <p>Account type: <span th:text="${user.userType}"></span></p>
        <div th:if="${user.userType == 'premium'}" class="mt-2 text-green-600">⭐ Premium member – 10% discount</div>
    </div>
</div>
</body>
</html>
