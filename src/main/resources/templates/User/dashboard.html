<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: html(~{::title}, ~{::main})}">
<head><title th:fragment="title">Dashboard – TaxiGo</title></head>
<main th:fragment="main">
    <section class="py-10 container mx-auto px-4">
        <div th:if="${message}" class="bg-green-100 text-green-800 p-4 rounded-lg mb-6 max-w-4xl mx-auto" th:text="${message}"></div>

        <div class="grid lg:grid-cols-3 gap-8 max-w-5xl mx-auto">
            <div class="lg:col-span-1">
                <div class="bg-white rounded-xl shadow p-6">
                    <h2 class="text-xl font-bold text-purple-700">Welcome, <span th:text="${user.name}"></span>!</h2>
                    <p class="text-gray-600 mt-2 text-sm" th:text="${user.email}"></p>
                    <p class="mt-2">
                        <span class="inline-block bg-purple-100 text-purple-800 text-xs px-2 py-1 rounded capitalize"
                              th:text="${user.userType}">regular</span>
                    </p>
                    <div th:if="${user.userType == 'premium'}" class="mt-3 text-green-600 text-sm font-medium">
                        ⭐ Premium – 10% off every ride
                    </div>
                    <div class="mt-6 space-y-2">
                        <a th:href="@{/book-ride}" class="block w-full text-center bg-yellow-400 text-gray-900 font-bold py-3 rounded-lg hover:bg-yellow-300">
                            Book a Ride
                        </a>
                        <a th:href="@{/user/profile}" class="block w-full text-center border border-purple-600 text-purple-600 py-2 rounded-lg hover:bg-purple-50">
                            Edit Profile
                        </a>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-2">
                <div class="bg-white rounded-xl shadow p-6">
                    <h3 class="text-lg font-bold mb-4">My Bookings</h3>
                    <div th:if="${bookings == null or bookings.isEmpty()}" class="text-gray-500 text-center py-8">
                        No bookings yet. <a th:href="@{/book-ride}" class="text-purple-600 font-semibold">Book your first ride</a>
                    </div>
                    <div th:each="b : ${bookings}" class="border rounded-lg p-4 mb-4 last:mb-0">
                        <div class="flex flex-wrap justify-between items-start gap-2">
                            <div>
                                <p class="font-semibold" th:text="|${b.pickup} → ${b.dropoff}|">Route</p>
                                <p class="text-sm text-gray-500"
                                   th:text="|${b.pickupDate} at ${b.pickupTime} · ${b.vehicleType}|">Details</p>
                                <p class="text-sm text-purple-600 font-medium mt-1"
                                   th:text="|LKR ${#numbers.formatDecimal(b.fare, 1, 2)}|">Fare</p>
                            </div>
                            <span class="text-xs px-2 py-1 rounded font-medium"
                                  th:classappend="${b.status == 'CANCELLED'} ? 'bg-red-100 text-red-800' : 'bg-green-100 text-green-800'"
                                  th:text="${b.status}">CONFIRMED</span>
                        </div>
                        <form th:if="${b.status != 'CANCELLED'}" th:action="@{/user/bookings/cancel}" method="post" class="mt-3">
                            <input type="hidden" name="bookingId" th:value="${b.bookingId}">
                            <button type="submit" class="text-sm text-red-600 hover:underline"
                                    onclick="return confirm('Cancel this booking?')">Cancel booking</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
</html>
