<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Profile - TaxiGo</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body>
<div class="bg-white shadow p-4">
    <div class="container mx-auto flex justify-between">
        <h1 class="text-2xl font-bold text-purple-600">🚕 TaxiGo</h1>
        <a href="/taxi/user/dashboard" class="text-gray-600">Back to Dashboard</a>
    </div>
</div>
<div class="max-w-md mx-auto bg-white p-8 rounded shadow mt-10">
    <h2 class="text-2xl font-bold mb-4">Update Profile</h2>
    <div th:if="${message}" class="bg-green-100 text-green-700 p-2 mb-4 rounded" th:text="${message}"></div>
    <div th:if="${error}" class="bg-red-100 text-red-700 p-2 mb-4 rounded" th:text="${error}"></div>
    <form action="/taxi/user/profile/update" method="post">
        <input type="text" name="name" th:value="${user.name}" required class="w-full border p-2 mb-3 rounded">
        <input type="email" name="email" th:value="${user.email}" required class="w-full border p-2 mb-3 rounded">
        <input type="tel" name="phone" th:value="${user.phone}" required class="w-full border p-2 mb-3 rounded">
        <input type="password" name="password" placeholder="New password (leave blank to keep)" class="w-full border p-2 mb-3 rounded">
        <button type="submit" class="bg-purple-600 text-white w-full py-2 rounded">Update</button>
    </form>
    <form action="/taxi/user/delete" method="post" onsubmit="return confirm('Delete account?')" class="mt-6">
        <button type="submit" class="bg-red-500 text-white w-full py-2 rounded">Delete Account</button>
    </form>
</div>
</body>
</html>
