<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: html(~{::title}, ~{::main})}">
<head><title th:fragment="title">Profile – TaxiGo</title></head>
<main th:fragment="main">
    <section class="py-16 container mx-auto px-4">
        <div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-lg">
            <h2 class="text-2xl font-bold text-purple-700 mb-6">Update Profile</h2>
            <div th:if="${message}" class="bg-green-100 text-green-700 p-3 mb-4 rounded" th:text="${message}"></div>
            <div th:if="${error}" class="bg-red-100 text-red-700 p-3 mb-4 rounded" th:text="${error}"></div>
            <form th:action="@{/user/profile/update}" method="post" class="space-y-4">
                <input type="text" name="name" th:value="${user.name}" required
                       class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-purple-500 outline-none">
                <input type="email" name="email" th:value="${user.email}" required
                       class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-purple-500 outline-none">
                <input type="tel" name="phone" th:value="${user.phone}" required
                       class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-purple-500 outline-none">
                <input type="password" name="password" placeholder="New password (leave blank to keep)"
                       class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-purple-500 outline-none">
                <button type="submit" class="w-full bg-purple-600 text-white py-3 rounded-lg font-semibold hover:bg-purple-700">
                    Update Profile
                </button>
            </form>
            <form th:action="@{/user/delete}" method="post" class="mt-6"
                  onsubmit="return confirm('Delete your account permanently?')">
                <button type="submit" class="w-full bg-red-500 text-white py-2 rounded-lg hover:bg-red-600">
                    Delete Account
                </button>
            </form>
            <p class="mt-4 text-center">
                <a th:href="@{/user/dashboard}" class="text-purple-600 text-sm">← Back to Dashboard</a>
            </p>
        </div>
    </section>
</main>
</html>
