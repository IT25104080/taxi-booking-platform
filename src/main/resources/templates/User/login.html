<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - TaxiGo</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
<div class="max-w-md mx-auto bg-white p-8 rounded shadow mt-20">
    <h2 class="text-2xl font-bold mb-4">Login</h2>
    <div th:if="${error}" class="bg-red-100 text-red-700 p-2 mb-4 rounded" th:text="${error}"></div>
    <div th:if="${message}" class="bg-green-100 text-green-700 p-2 mb-4 rounded" th:text="${message}"></div>
    <form action="/taxi/user/login" method="post">
        <input type="email" name="email" placeholder="Email" required class="w-full border p-2 mb-3 rounded">
        <input type="password" name="password" placeholder="Password" required class="w-full border p-2 mb-3 rounded">
        <button type="submit" class="bg-purple-600 text-white w-full py-2 rounded">Login</button>
    </form>
    <p class="mt-4 text-center">No account? <a href="/taxi/user/register" class="text-purple-600">Register</a></p>
</div>
</body>
</html>
