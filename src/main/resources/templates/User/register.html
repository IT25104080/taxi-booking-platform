<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: html(~{::title}, ~{::main})}">
<head><title th:fragment="title">Register – TaxiGo</title></head>
<main th:fragment="main">
    <section class="py-16 container mx-auto px-4">
        <div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-lg">
            <h2 class="text-2xl font-bold text-purple-700 mb-6 text-center">Create Account</h2>
            <div th:if="${error}" class="bg-red-100 text-red-700 p-3 mb-4 rounded" th:text="${error}"></div>
            <form th:action="@{/user/register}" method="post" class="space-y-4">
                <input type="text" name="name" placeholder="Full Name" required
                       class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-purple-500 outline-none">
                <input type="email" name="email" placeholder="Email" required
                       class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-purple-500 outline-none">
                <input type="tel" name="phone" placeholder="Phone" required
                       class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-purple-500 outline-none">
                <input type="password" name="password" placeholder="Password" required
                       class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-purple-500 outline-none">
                <select name="userType" class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-purple-500 outline-none">
                    <option value="regular">Regular User</option>
                    <option value="premium">Premium (10% discount on rides)</option>
                </select>
                <button type="submit" class="w-full bg-purple-600 text-white py-3 rounded-lg font-semibold hover:bg-purple-700">
                    Register
                </button>
            </form>
            <p class="mt-6 text-center text-gray-600">
                Already have an account? <a th:href="@{/user/login}" class="text-purple-600 font-semibold">Login</a>
            </p>
        </div>
    </section>
</main>
</html>
