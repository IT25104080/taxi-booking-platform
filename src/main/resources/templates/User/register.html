<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register - TaxiGo</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
<div class="max-w-md mx-auto bg-white p-8 rounded shadow mt-10">
    <h2 class="text-2xl font-bold mb-4">Create Account</h2>
    <div th:if="${error}" class="bg-red-100 text-red-700 p-2 mb-4 rounded" th:text="${error}"></div>
    <form action="/taxi/user/register" method="post">
        <input type="text" name="name" placeholder="Full Name" required class="w-full border p-2 mb-3 rounded">
        <input type="email" name="email" placeholder="Email" required class="w-full border p-2 mb-3 rounded">
        <input type="tel" name="phone" placeholder="Phone" required class="w-full border p-2 mb-3 rounded">
        <input type="password" name="password" placeholder="Password" required class="w-full border p-2 mb-3 rounded">
        <select name="userType" class="w-full border p-2 mb-3 rounded">
            <option value="regular">Regular User</option>
            <option value="premium">Premium (10% discount)</option>
        </select>
        <button type="submit" class="bg-purple-600 text-white w-full py-2 rounded">Register</button>
    </form>
    <p class="mt-4 text-center">Already have an account? <a href="/taxi/user/login" class="text-purple-600">Login</a></p>
</div>
</body>
</html>
