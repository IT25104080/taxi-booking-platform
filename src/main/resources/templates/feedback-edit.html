<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>VibeRide</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="container"><h1>Edit Feedback</h1><a class="btn secondary" href="/feedbacks">Back</a><form th:if="${type=='RIDE'}" action="/feedbacks/update/ride" method="post"><input name="feedbackId" th:value="${feedback.feedbackId}" readonly><input name="customerName" th:value="${feedback.customerName}"><input name="rating" type="number" min="1" max="5" th:value="${feedback.rating}"><textarea name="comments" th:text="${feedback.comments}"></textarea><input name="date" type="date" th:value="${feedback.date}"><input name="rideId" th:value="${rideFeedback.rideId}"><input name="driverName" th:value="${rideFeedback.driverName}"><input name="driverRating" type="number" th:value="${rideFeedback.driverRating}"><input name="punctualityRating" type="number" th:value="${rideFeedback.punctualityRating}"><input name="vehicleRating" type="number" th:value="${rideFeedback.vehicleRating}"><button class="btn">Update</button></form><form th:if="${type=='PLATFORM'}" action="/feedbacks/update/platform" method="post"><input name="feedbackId" th:value="${feedback.feedbackId}" readonly><input name="customerName" th:value="${feedback.customerName}"><input name="rating" type="number" min="1" max="5" th:value="${feedback.rating}"><textarea name="comments" th:text="${feedback.comments}"></textarea><input name="date" type="date" th:value="${feedback.date}"><input name="category" th:value="${platformFeedback.category}"><button class="btn">Update</button></form></div></body></html>
