<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>VibeRide</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="container"><h1>Edit Driver</h1><a class="btn secondary" href="/drivers">Back</a><form th:if="${type=='FULLTIME'}" action="/drivers/update/fulltime" method="post"><input name="driverId" th:value="${driver.driverId}" readonly><input name="name" th:value="${driver.name}"><input name="licenseNo" th:value="${driver.licenseNo}"><input name="phone" th:value="${driver.phone}"><input name="vehicleType" th:value="${driver.vehicleType}"><input name="vehiclePlate" th:value="${driver.vehiclePlate}"><input name="status" th:value="${driver.status}"><input name="date" type="date" th:value="${driver.joinedDate}"><input name="monthlySalary" type="number" step="0.01" th:value="${fullTimeDriver.monthlySalary}"><input name="shiftHours" th:value="${fullTimeDriver.shiftHours}"><button class="btn">Update</button></form><form th:if="${type=='PARTTIME'}" action="/drivers/update/parttime" method="post"><input name="driverId" th:value="${driver.driverId}" readonly><input name="name" th:value="${driver.name}"><input name="licenseNo" th:value="${driver.licenseNo}"><input name="phone" th:value="${driver.phone}"><input name="vehicleType" th:value="${driver.vehicleType}"><input name="vehiclePlate" th:value="${driver.vehiclePlate}"><input name="status" th:value="${driver.status}"><input name="date" type="date" th:value="${driver.joinedDate}"><input name="hourlyRate" type="number" step="0.01" th:value="${partTimeDriver.hourlyRate}"><input name="hoursWorked" type="number" th:value="${partTimeDriver.hoursWorked}"><button class="btn">Update</button></form></div></body></html>
