<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>VibeRide</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="container"><h1>Edit Booking</h1><a class="btn secondary" href="/bookings">Back</a><form th:if="${type=='INSTANT'}" action="/bookings/update/instant" method="post"><input name="bookingId" th:value="${booking.bookingId}" readonly><input name="passengerId" th:value="${booking.passengerId}"><input name="pickupLocation" th:value="${booking.pickupLocation}"><input name="dropoffLocation" th:value="${booking.dropoffLocation}"><input name="distanceKm" type="number" step="0.01" th:value="${booking.distanceKm}"><input name="status" th:value="${booking.status}"><input name="date" type="date" th:value="${booking.bookingDate}"><input name="surgeMultiplier" type="number" step="0.01" th:value="${instantBooking.surgeMultiplier}"><button class="btn">Update</button></form><form th:if="${type=='SCHEDULED'}" action="/bookings/update/scheduled" method="post"><input name="bookingId" th:value="${booking.bookingId}" readonly><input name="passengerId" th:value="${booking.passengerId}"><input name="pickupLocation" th:value="${booking.pickupLocation}"><input name="dropoffLocation" th:value="${booking.dropoffLocation}"><input name="distanceKm" type="number" step="0.01" th:value="${booking.distanceKm}"><input name="status" th:value="${booking.status}"><input name="date" type="date" th:value="${booking.bookingDate}"><input name="scheduledTime" th:value="${scheduledBooking.scheduledTime}"><label><input style="width:auto" type="checkbox" name="reminderSent" value="true"> Reminder Sent</label><button class="btn">Update</button></form></div></body></html>
