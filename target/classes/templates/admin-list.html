<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>VibeRide</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="container"><h1>Admin Management</h1><a class="btn" href="/admins/new">Add Admin</a><a class="btn secondary" href="/">Home</a><table><tr><th>ID</th><th>Name</th><th>Email</th><th>Department</th><th>Role</th><th>Actions</th></tr><tr th:each="a:${adminList}"><td th:text="${a.adminId}"></td><td th:text="${a.name}"></td><td th:text="${a.email}"></td><td th:text="${a.department}"></td><td th:text="${a.role}"></td><td><a th:href="@{/admins/edit/{id}(id=${a.adminId})}">Edit</a> | <a th:href="@{/admins/delete/{id}(id=${a.adminId})}">Delete</a></td></tr></table></div></body></html>
