<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>VibeRide</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="container"><h1>Edit Admin</h1><a class="btn secondary" href="/admins">Back</a><form th:if="${type=='SUPER'}" action="/admins/update/super" method="post"><input name="adminId" th:value="${admin.adminId}" readonly><input name="name" th:value="${admin.name}"><input name="email" th:value="${admin.email}"><input name="password" th:value="${admin.password}"><input name="department" th:value="${admin.department}"><input name="date" type="date" th:value="${admin.createdDate}"><input name="accessLevel" th:value="${superAdmin.accessLevel}"><input name="managedAdmins" type="number" th:value="${superAdmin.managedAdmins}"><button class="btn">Update</button></form><form th:if="${type=='SUPPORT'}" action="/admins/update/support" method="post"><input name="adminId" th:value="${admin.adminId}" readonly><input name="name" th:value="${admin.name}"><input name="email" th:value="${admin.email}"><input name="password" th:value="${admin.password}"><input name="department" th:value="${admin.department}"><input name="date" type="date" th:value="${admin.createdDate}"><input name="ticketCategory" th:value="${supportAdmin.ticketCategory}"><input name="resolvedTickets" type="number" th:value="${supportAdmin.resolvedTickets}"><button class="btn">Update</button></form></div></body></html>
