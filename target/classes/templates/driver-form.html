<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>VibeRide</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="container"><h1>Add Driver</h1><a class="btn secondary" href="/drivers">Back</a><div class="grid"><div class="card"><h2>Full-Time Driver</h2><form action="/drivers/fulltime" method="post"><input name="driverId" placeholder="Driver ID" required><input name="name" placeholder="Name" required><input name="licenseNo" placeholder="License No" required><input name="phone" placeholder="Phone" required><input name="vehicleType" placeholder="Vehicle Type" required><input name="vehiclePlate" placeholder="Vehicle Plate" required><input name="status" value="Available" required><input name="monthlySalary" type="number" step="0.01" placeholder="Monthly Salary" required><input name="shiftHours" placeholder="Shift Hours" required><button class="btn">Save</button></form></div><div class="card"><h2>Part-Time Driver</h2><form action="/drivers/parttime" method="post"><input name="driverId" placeholder="Driver ID" required><input name="name" placeholder="Name" required><input name="licenseNo" placeholder="License No" required><input name="phone" placeholder="Phone" required><input name="vehicleType" placeholder="Vehicle Type" required><input name="vehiclePlate" placeholder="Vehicle Plate" required><input name="status" value="Available" required><input name="hourlyRate" type="number" step="0.01" placeholder="Hourly Rate" required><input name="hoursWorked" type="number" placeholder="Hours Worked" required><button class="btn">Save</button></form></div></div></div></body></html>
