<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>VibeRide</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="container"><h1>Payment Management</h1><a class="btn" href="/payments/new">Add Payment</a><a class="btn secondary" href="/">Home</a><table><tr><th>ID</th><th>Booking</th><th>Amount</th><th>Status</th><th>Info</th><th>Actions</th></tr><tr th:each="p:${paymentList}"><td th:text="${p.paymentId}"></td><td th:text="${p.bookingId}"></td><td th:text="${p.amount}"></td><td th:text="${p.status}"></td><td th:text="${p.receipt}"></td><td><a th:href="@{/payments/edit/{id}(id=${p.paymentId})}">Edit</a> | <a th:href="@{/payments/delete/{id}(id=${p.paymentId})}">Delete</a></td></tr></table></div></body></html>
